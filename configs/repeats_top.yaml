# Seed replicates of the best model of the ViT and SSL families (the CNN reference is in repeats.yaml).
tile_mm: 50
epochs: 15
steps_per_epoch: 100
batch_size: 32
input_px: 224
experiments:
  - {name: rep_p2_tinyvit_scratch_s1, part: "2", arch: tiny_vit, pretrained: false, optimizer: adamw, lr: 5.0e-4, weight_decay: 0.05, warmup_epochs: 2, seed: 1}
  - {name: rep_p2_tinyvit_scratch_s2, part: "2", arch: tiny_vit, pretrained: false, optimizer: adamw, lr: 5.0e-4, weight_decay: 0.05, warmup_epochs: 2, seed: 2}
  - {name: rep_p3_dinov3_s_ft_s1, part: "3", arch: vit_small_patch16_dinov3.lvd1689m, optimizer: adamw, lr: 2.0e-5, weight_decay: 0.05, warmup_epochs: 1, llrd: 0.75, drop_path: 0.1, seed: 1}
  - {name: rep_p3_dinov3_s_ft_s2, part: "3", arch: vit_small_patch16_dinov3.lvd1689m, optimizer: adamw, lr: 2.0e-5, weight_decay: 0.05, warmup_epochs: 1, llrd: 0.75, drop_path: 0.1, seed: 2}
