[project]
name = "soilgs"
version = "0.1.0"
description = "Soil grain-size distribution from smartphone photos: CNN, ViT and self-supervised pipelines (AI401 Assignment #1)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "scikit-image>=0.24",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "torch>=2.7",
    "torchvision>=0.22",
    "timm>=1.0.15",
    "peft>=0.13",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "pytest>=8.3",
    "kaggle>=1.7",
    "six>=1.16",
]

[tool.uv]
default-groups = ["dev"]

# RTX 50xx (sm_120) needs CUDA 12.8 wheels; Colab/Kaggle keep their preinstalled torch.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soilgs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
